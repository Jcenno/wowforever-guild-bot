name: Probe item endpoints
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Item name to search"
        default: "Linen Cloth"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python3 probe_items.py "${{ inputs.query }}"
